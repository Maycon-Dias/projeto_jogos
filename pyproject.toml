[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meu_app"
version = "0.1.0"
description = "Aplicativo de jogos com interativas com Tkinter"
authors = [{ name = "Maycon Dias" }]
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
meu-app = "meu_app.main:run"

[tool.setuptools.packages.find]
where = ["src"]